name: COP CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: node --check src/gateway.js
      - run: node --check ftp-gateway/watcher.js
      - run: sh -n ftp-gateway/entrypoint.sh
      - run: docker build -t cop-ftp-gateway ./ftp-gateway
