name: COP CI

on:
  push:
    branches: [main, codex/intelbras-autoregister-pilot]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: cop_test
          POSTGRES_DB: cop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:cop_test@localhost:5432/cop_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: node --check src/gateway.js
      - run: node --check ftp-gateway/watcher.js
      - run: sh -n ftp-gateway/entrypoint.sh
      - run: docker build -t cop-ftp-gateway ./ftp-gateway
